const FORM_LABELS={mega:'メガシンカ',gmax:'キョダイマックス'};
// Mega Evolution and Gigantamax forms are separate collectible entries keyed by their PokeAPI pokemon id (10001+).
const formNote=f=>f.form==='gmax'?`キョダイマックスした ${f.baseName}の すがただよ。`:`メガシンカした ${f.baseName}の すがただよ。`;
const pokemons=[...catalogSnapshot.map(p=>({...p,note:`${p.genus}だよ。`})),...formSnapshot.map(f=>({...f,note:formNote(f),image:f.hasArtwork?artworkUrl(f.pokemonId):undefined}))];
const metadataKey='pokemon-pokeapi-metadata-v1',listKey='pokemon-pokeapi-new-species-v1';
const inflight=new Map();let detailCache={};
try{const cache=JSON.parse(localStorage.getItem(metadataKey)||'{}');if(cache&&typeof cache==='object'&&!Array.isArray(cache))detailCache=cache;const additions=JSON.parse(localStorage.getItem(listKey)||'[]');if(Array.isArray(additions))for(const p of additions)if(Number.isInteger(p.id)&&p.id>0&&!pokemons.some(x=>x.id===p.id))pokemons.push({...p});}catch{}
for(const p of pokemons){const saved=detailCache[p.id];if(saved&&saved.name)Object.assign(p,saved);}
pokemons.sort((a,b)=>a.id-b.id);
function getPokemon(id){return pokemons.find(p=>p.id===Number(id));}
function artworkUrl(id){return`https://raw.githubusercontent.com/PokeAPI/sprites/master/sprites/pokemon/other/official-artwork/${Number(id)}.png`;}
function spriteUrl(id){return`https://raw.githubusercontent.com/PokeAPI/sprites/master/sprites/pokemon/${Number(id)}.png`;}
function normalizeSearch(s){return String(s).normalize('NFKC').replace(/[ぁ-ゖ]/g,c=>String.fromCharCode(c.charCodeAt(0)+96)).replace(/\s/g,'').toLowerCase();}
function filterCatalog(list,{query='',filter='all',generation='all',form='all'}={},owned=new Set()){
 const q=normalizeSearch(query);return list.filter(p=>(filter!=='caught'||owned.has(p.id))&&(filter!=='unseen'||!owned.has(p.id))&&(generation==='all'||p.generation===Number(generation))&&(form==='all'||(form==='normal'?!p.form:p.form===form))&&(!q||normalizeSearch(p.name).includes(q)||p.slug.includes(q)||normalizeSearch(FORM_LABELS[p.form]||'').includes(q)||(!p.form&&String(p.id).includes(q.replace(/^0+(?=\d)/,'')))));
}
function chooseEncounter(list,owned,random=Math.random){const missing=list.filter(p=>!owned.has(p.id)),pool=missing.length?missing:list;if(!pool.length)return null;return pool[Math.min(pool.length-1,Math.floor(Math.max(0,random())*pool.length))].id;}
async function fetchApi(path){const controller=new AbortController(),timer=setTimeout(()=>controller.abort(),9000);try{const res=await fetch(API_ROOT+path,{signal:controller.signal,credentials:'omit'});if(!res.ok)throw new Error(`PokeAPI ${res.status}`);return await res.json();}finally{clearTimeout(timer);}}

function shuffle(a,r=Math.random){a=[...a];for(let i=a.length-1;i>0;i--){const j=Math.floor(r()*(i+1));[a[i],a[j]]=[a[j],a[i]];}return a;}

 const q=s.questions[s.index],isLang=q.kind==='lang',subIndex=s.mode==='daily'?(isLang?s.index-s.count:s.index):s.index;return`<section class="exercise"><div class="exercise-top"><button class="back" data-action="pause">${icon('back')}あとで つづける</button><span class="time-chip">${icon('clock')}<span id="elapsed">${Math.floor(s.seconds/60)}ふん ${s.seconds%60}びょう</span></span></div><div class="exercise-top"><strong>${s.mode==='practice'?'12もん クエスト':isLang?'STEP 02　こくご':'STEP 01　さんすう'}</strong><span class="progress-label">${subIndex+1} / ${s.count}もん</span></div><div class="progress" role="progressbar" aria-valuenow="${s.index}" aria-valuemin="0" aria-valuemax="${s.questions.length}" aria-label="クリアした もんだい"><div style="width:${s.index/s.questions.length*100}%"></div></div><div class="problem-card"><div class="problem-top"><span class="problem-tag ${isLang?'lang':''}">${esc(q.tag)}</span><button class="read" data-action="read">${icon('sound')}よんで</button></div><h1 class="question">${esc(q.text)}</h1>${q.kind==='clock'?clockSvg(q.h,q.m):q.kind==='multiply'&&!q.hidePicture?`<div class="groups" aria-label="${q.a}こずつ ${q.b}くみ">${Array.from({length:q.b},()=>`<div class="group">${Array.from({length:q.a},()=>'<span class="count-dot" aria-hidden="true">★</span>').join('')}</div>`).join('')}</div>`:q.dots?`<div class="picture" aria-hidden="true">${Array.from({length:q.dots},()=>'<span class="count-dot">★</span>').join('')}</div>`:''}<div class="options">${q.options.map((o,i)=>`<button class="answer ${feedback?.correct&&o===q.answer?'correct':feedback?.wrong===o?'wrong':''}" data-action="answer" data-index="${i}" ${feedback?.correct?'disabled':''}>${esc(o)}</button>`).join('')}</div>${feedback?`<div class="feedback ${feedback.correct?'good':''}" role="status"><strong>${feedback.correct?'せいかい！ よく できたね。':feedback.wrong?'おしい！ もう いちど。':'ヒントだよ。'}</strong><br>${esc(feedback.correct?q.explain:q.hint).replace(/\n/g,'<br>')}</div>`:''}${feedback?.correct?`<div class="next-row"><button class="primary green" data-action="next">${db.rewardProgress===QUESTIONS_PER_CATCH-1?'ポケモンに あいにいく':s.index===s.questions.length-1?'けっかを みる':'つぎへ'}${icon('arrow')}</button></div>`:''}</div><div class="support"><button data-action="hint">${icon('bulb')}ヒントを みる</button><button data-action="pause">${icon('home')}きゅうけいする</button></div><p class="help-note">${catchProgress()}。<br>まちがえても、なんどでも やりなおせるよ。</p></section>`;}
function answer(i){const s=db.session;if(!s||s.stage!=='questions'||feedback?.correct)return;const q=s.questions[s.index],o=q.options[i];if(o===undefined)return;if(o===q.answer){feedback={correct:true};if(db.settings.sound)chime();}else{if(!s.missed.includes(s.index))s.missed.push(s.index);s.mistakes++;feedback={wrong:o};save();}render();}
function next(){if(!feedback?.correct)return;const s=db.session;s.index++;feedback=null;let desired=s.index===s.questions.length?(s.mode==='daily'?'daily-done':'practice-done'):s.mode==='daily'&&s.index===s.count?'break':'questions';if(creditQuestion(db)){s.afterCaptureStage=desired;s.stage='capture';s.reward=chooseEncounter(pokemons,captured());s.captureId=`${s.id}:${s.index}`;loadPokemonDetails(s.reward).then(p=>{if(p&&db.session===s&&route==='exercise'&&!busy)render();});}else{s.stage=desired;if(desired==='daily-done'||desired==='practice-done')finishLearningRecord(db);}save();render();}
function captureView(){const s=db.session,p=getPokemon(s.reward)||pokemons[0],caught=s.stage==='caught';return`<div class="exercise"><section class="stage ${busy?'catching':''}">${caught?'<div class="confetti"></div>':''}<span class="tag">${caught?'ポケモン ゲット！':'12もん クリア！'}</span><h1>${caught?`${esc(p.name)}を ゲット！`:'やせいの ポケモンが あらわれた！'}</h1><div class="capture-scene">${pokemon(p.id,'stage-poke wild')}${!caught?ball():''}</div><p>${caught?'がんばった きみの、あたらしい なかまだよ。':`12もん、よく がんばったね。<br>ボールを なげて、${esc(p.name)}を つかまえよう！`}</p><button class="primary ${caught?'green':''}" data-action="${caught?'capture-continue':'catch'}" ${busy?'disabled':''}>${caught?(s.afterCaptureStage==='daily-done'||s.afterCaptureStage==='practice-done'?'けっかを みる':'ドリルを つづける'):busy?'つかまえているよ…':'ボールを なげる！'}${icon(caught?'arrow':'ball')}</button>${caught?`<p class="help-note">あと ${QUESTIONS_PER_CATCH-db.rewardProgress}もんで、つぎの ポケモンに あえるよ。</p>`:''}</section></div>`;}
function catchPokemon(){if(busy||db.session?.stage!=='capture')return;busy=true;render();setTimeout(()=>{registerCapture(db);save();busy=false;render();if(db.settings.sound)chime();},2600);}
function continueAfterCapture(){const s=db.session;if(!s||s.stage!=='caught')return;s.stage=s.afterCaptureStage||'questions';s.reward=null;s.captureId=null;s.afterCaptureStage=null;if(s.stage==='daily-done'||s.stage==='practice-done')finishLearningRecord(db);feedback=null;save();lastTick=Date.now();render();}
function dailyResult(){const s=db.session,caught=db.catches.filter(c=>s.catchIds.includes(c.id));return`<div class="exercise"><section class="stage">${pokemon(caught.at(-1)?.pokemon||25,'stage-poke')}<h1>きょうの ぼうけん、クリア！</h1><p>さんすうと こくご、${s.questions.length}もん よく がんばったね。<br>${caught.length?`${caught.length}ひきの ポケモンを ゲットしたよ！`:`${catchProgress()}。つぎの クエストに つづくよ。`}</p><button class="primary green" data-action="next-quest">つぎの クエストに いく${icon('arrow')}</button><div><button class="text-link" data-action="finish">ずかんに あいにいく</button><button class="text-link" data-action="daily-again">さんすうと こくごを もういちど</button></div><p class="help-note">${dailyEncouragement()}<br>おうちの ひとに「おわったよ！」と つたえよう。<br>${storageOK?'きろくは この たんまつに ほぞんしたよ。':'きろくを ほぞんできなかったよ。おうちの ひとに つたえよう。'}</p></section></div>`;}
function practiceResult(){const s=db.session,caught=db.catches.filter(c=>s.catchIds.includes(c.id));return`<div class="exercise"><section class="stage"><span class="tag">クエスト クリア！</span>${pokemon(caught.at(-1)?.pokemon||25,'stage-poke')}<h1>クエスト、よく できたね！</h1><p>${s.questions.length}もん ぜんぶ クリア！<br>${caught.length?`${caught.length}ひきの ポケモンを ゲットしたよ！`:'とちゅうの もんだいも、つぎの ゲットに つながるよ。'}</p><button class="primary green" data-action="quest-again">おなじ クエストを もういちど${icon('arrow')}</button><div><button class="text-link" data-action="next-quest">べつの クエストを えらぶ</button><button class="text-link" data-action="finish">ずかんを みる</button></div><p class="help-note">${dailyEncouragement()}<br>1にち なんかいでも チャレンジできるよ。<br>ひといき ついて、じぶんの ペースで。</p></section></div>`;}
function collectionPage(){const owned=captured(),list=filterCatalog(pokemons,collectionState,owned),pages=Math.max(1,Math.ceil(list.length/PAGE_SIZE));collectionState.page=Math.min(pages,Math.max(1,collectionState.page));const visible=list.slice((collectionState.page-1)*PAGE_SIZE,collectionState.page*PAGE_SIZE);const pager=()=>`<div class="catalog-pager"><button data-action="catalog-prev" ${collectionState.page===1?'disabled':''}>${icon('back')}まえ</button><span>${collectionState.page} / ${pages}ページ</span><button data-action="catalog-next" ${collectionState.page>=pages?'disabled':''}>つぎ${icon('arrow')}</button></div>`;return`<div class="catalog-summary" role="status">${list.length}しゅるい みつかったよ${list.length?`・${(collectionState.page-1)*PAGE_SIZE+1}〜${Math.min(collectionState.page*PAGE_SIZE,list.length)}ばんめ`:''}</div>${pager()}${visible.length?`<div class="collection">${visible.map(p=>`<button class="poke-card ${owned.has(p.id)?'owned':'unseen'}" data-action="detail" data-id="${p.id}" aria-label="${esc(p.name)}${owned.has(p.id)?'・ゲットずみ':''}"><small>${p.form?`<span class="form-badge ${p.form}">${FORM_LABELS[p.form]}</span>`:`No. ${String(p.id).padStart(4,'0')}`}</small>${pokemon(p.id)}<strong>${esc(p.name)}</strong><span class="poke-type">${esc(p.type)}</span><span class="capture-status ${owned.has(p.id)?'yes':''}">${owned.has(p.id)?'✓ ゲットずみ':'まだ ゲットしていない'}</span></button>`).join('')}</div>`:'<div class="empty">みつからなかったよ。なまえや すうじを かえてみよう。</div>'}${pager()}`;}
function collection(){const owned=captured();return`<div class="subhead"><span class="eyebrow">きみだけの、ぼうけんの なかまたち。</span><h1>ポケモンずかん</h1><p>${owned.size} / ${pokemons.length.toLocaleString('ja-JP')}しゅるい ゲット！ ぜんこくの ポケモンに、メガシンカと キョダイマックスの すがたも あえるよ。</p></div><div class="catalog-tools"><label class="catalog-search" for="pokemon-search">なまえ・ずかんばんごう<input id="pokemon-search" type="search" placeholder="ピカチュウ、メガ、25 など" value="${esc(collectionState.query)}" autocomplete="off"></label><label for="catalog-filter">しぼりこみ<select id="catalog-filter"><option value="all" ${collectionState.filter==='all'?'selected':''}>ぜんぶ</option><option value="caught" ${collectionState.filter==='caught'?'selected':''}>ゲットずみ</option><option value="unseen" ${collectionState.filter==='unseen'?'selected':''}>まだ ゲットしていない</option></select></label><label for="catalog-generation">ぼうけんの ちほう<select id="catalog-generation"><option value="all">ぜんぶの ちほう</option>${['カントー','ジョウト','ホウエン','シンオウ','イッシュ','カロス','アローラ','ガラル・ヒスイ','パルデア・キタカミ'].map((g,i)=>`<option value="${i+1}" ${String(collectionState.generation)===String(i+1)?'selected':''}>${g}</option>`).join('')}</select></label><label for="catalog-form">すがた<select id="catalog-form">${[['all','ぜんぶ'],['normal','ふつうの すがた'],['mega','メガシンカ'],['gmax','キョダイマックス']].map(([v,l])=>`<option value="${v}" ${collectionState.form===v?'selected':''}>${l}</option>`).join('')}</select></label></div><p class="help-note" style="text-align:left">タップすると ポケモンの ことを しらべられるよ。12もんごとに 1ひき、ドリルで ゲットしよう！</p><div id="catalog-results">${collectionPage()}</div><p class="help-note">ぜんこくずかんの ぜんしゅるいと、メガシンカ・キョダイマックスの すがたが とうじょうするよ。<br>画像の表示と最新情報の取得にはインターネット接続が必要です。</p>${footer()}`;}
function updateCollection(){const el=document.getElementById('catalog-results');if(el)el.innerHTML=collectionPage();}
function detailMarkup(p,status='loading'){const count=db.catches.filter(c=>c.pokemon===p.id).length;return`<div class="dialog-head"><div><span class="eyebrow">${p.form?FORM_LABELS[p.form]:`No. ${String(p.id).padStart(4,'0')}`}</span><h2>${esc(p.name)}</h2></div><button class="close" data-action="close" aria-label="とじる">×</button></div>${pokemon(p.id,'detail-poke')}<div style="text-align:center"><span class="poke-type">${esc(p.type)}</span>${p.legendary?'<span class="poke-type special">でんせつの ポケモン</span>':p.mythical?'<span class="poke-type special">まぼろしの ポケモン</span>':''}<p>${esc(p.note||p.genus||'ポケモン')}</p><p>${count?`✓ ゲットした かいすう：${count}かい`:'まだ ゲットしていないよ。<br>12もん クリアして、あいにいこう！'}</p><div class="api-status" role="status">${status==='loading'?'ポケモンの ことを しらべているよ…':status==='error'?'いまは つながらないので、ほぞんした ずかんを みせているよ。':'PokeAPIで しらべたよ。'}</div>${status==='error'?`<button class="text-link" data-action="detail" data-id="${p.id}">もういちど しらべる</button>`:''}</div>`;}
async function openPokemonDetail(id){const p=getPokemon(id);if(!p)return;openDialog(detailMarkup(p));const request=detailRequest;const loaded=await loadPokemonDetails(id);if(request!==detailRequest||!modal.firstChild)return;const dialog=modal.querySelector('.dialog');if(dialog)dialog.innerHTML=detailMarkup(loaded||p,loaded?'ready':'error');}
function practice(){const s=db.session;const cards=[['calc','＋ −','たしざん・ひきざん','10まで、または 20までの けいさん。'],['multiply','×','かけざん','1のだん・2のだん・3のだんを れんしゅう。'],['word','？','ぶんしょうだい','よく よんで、たす？ ひく？ を かんがえよう。'],['clock',icon('clock'),'とけい','みじかい はりと ながい はりを よもう。'],['lang','あ','こくご','ひらがな・カタカナ・かんじ・ぶんを よもう。'],['math','123','さんすう ミックス','いろいろな もんだいに チャレンジ。']];return`<div class="subhead"><h1>クエストを えらぼう！</h1><p>1かい 12もん。クリアして ポケモンを ゲット！ 1にち なんかいでも あそべるよ。</p></div>${s?.mode==='practice'&&s.stage!=='practice-done'?'<div class="empty">とちゅうの クエストが あるよ。<button class="text-link" data-action="resume">つづきから →</button></div>':''}<div class="practice-grid">${cards.map(([k,i,t,d])=>`<button class="practice-card" data-action="practice" data-kind="${k}"><span class="practice-icon">${i}</span><h2>${t}</h2><p>${d}</p><span class="quest-bottom">12もん チャレンジ ${icon('arrow')}</span></button>`).join('')}</div>${footer()}`;}
function historyCatchLabel(h){const ids=h.pokemonIds||[h.pokemon].filter(Boolean);return ids.length>1?`${ids.length}ひき ゲット！`:ids.length?`${esc(getPokemon(ids[0])?.name||'ポケモン')} ゲット！`:'ドリル クリア！';}
function history(){const all=Object.entries(db.history).sort((a,b)=>b[0].localeCompare(a[0]));return`<div class="subhead"><h1>がんばりの きろく</h1><p>いっぽずつ、まえに すすんでいるよ。</p></div><div class="history-stats"><div class="history-stat"><small>ぼうけんした ひ</small><strong>${all.length}<span style="font-size:13px"> にち</span></strong></div><div class="history-stat"><small>クリアした もんだい</small><strong>${all.reduce((n,[,h])=>n+h.questions,0)}<span style="font-size:13px"> もん</span></strong></div><div class="history-stat"><small>れんぞく クリア</small><strong>${streak()}<span style="font-size:13px"> にち</span></strong></div></div><div class="week-card" style="margin-bottom:25px"><h3>こんしゅう</h3>${week()}</div>${all.length?`<div class="history-list">${all.map(([d,h])=>`<div class="history-row"><div><strong>${formatDate(d)}</strong><br><span style="color:var(--muted)">${h.questions}もん${h.questRuns?`・クエスト ${h.questRuns}かい`:''}・${Math.floor(h.seconds/60)}ふん ${h.seconds%60}びょう</span></div><span>${historyCatchLabel(h)}</span>${h.pokemon?pokemon(h.pokemon,'thumb'):icon('check')}</div>`).join('')}</div>`:'<div class="empty">きょうの ぼうけんを クリアすると、ここに きろくが のこるよ。</div>'}${footer()}`;}
function render(){app.innerHTML=header()+`<main class="wrap" id="main">${({home,collection,practice,history,exercise}[route]||home)()}</main>`;}
function navigate(r){if(busy)return;route=r;feedback=null;render();window.scrollTo({top:0});}
function openDialog(html){detailRequest++;modal.innerHTML=`<div class="overlay"><section class="dialog" role="dialog" aria-modal="true" aria-label="おしらせ" tabindex="-1">${html}</section></div>`;modal.querySelector('.dialog')?.focus();}
function showDialog(title,text,action,label){openDialog(`<div class="dialog-head"><h2>${title}</h2><button class="close" data-action="close" aria-label="とじる">×</button></div><p>${text}</p><button class="primary" data-action="${action}">${label}${icon('arrow')}</button>`);}
function settings(){const st=db.settings;openDialog(`<div class="dialog-head"><h2>おうちのかたへ</h2><button class="close" data-action="close" aria-label="閉じる">×</button></div><p>ゲームの前に、毎日のドリルを。時間は目安です。正解するまでヒントを使って取り組めます。</p><div class="field"><label for="count">1回の算数・国語ドリルの学習量</label><select id="count"><option value="8" ${st.count===8?'selected':''}>約10分（算数8問＋国語8問）</option><option value="12" ${st.count===12?'selected':''}>約15分（算数12問＋国語12問）</option><option value="16" ${st.count===16?'selected':''}>約20分（算数16問＋国語16問）</option></select></div><div class="field"><label for="range">足し算・引き算の範囲</label><select id="range"><option value="10" ${st.range===10?'selected':''}>10まで</option><option value="20" ${st.range===20?'selected':''}>20まで（繰り上がり・繰り下がりを含む）</option></select></div><label class="toggle-row">1〜3の段の掛け算を日々のドリルに入れる<input id="multiply" type="checkbox" ${st.multiply?'checked':''}></label><p style="font-size:11px">掛け算は先取り学習です。難しければ外せます。図を見て同じ数を足すところから学びます。</p><div class="field"><label for="clock">時計の難しさ</label><select id="clock"><option value="half" ${st.clock==='half'?'selected':''}>ちょうどの時刻・30分</option><option value="five" ${st.clock==='five'?'selected':''}>5分刻み</option></select></div><label class="toggle-row">正解・ゲット時の音<input id="sound" type="checkbox" ${st.sound?'checked':''}></label><div class="save-note">12問クリアするごとに1匹捕まえられます。クエストは1日に何回でも挑戦でき、12問に満たない分は次の日へ引き継ぎます。<br>記録はこの端末の、このブラウザに保存します。プライベートブラウズや履歴・サイトデータの削除で失われることがあります。別端末との同期はありません。設定変更は次に始めるドリルから適用します。</div><p style="font-size:11px">このアプリから他のゲームの起動を制限することはできません。Safariの共有メニューから「ホーム画面に追加」すると開きやすくなります。</p><button class="primary green" data-action="save-settings">設定を保存</button><div class="field"><label>きろくの バックアップ</label><p style="font-size:11px">URLの変更や端末の入れ替えの前に、記録をファイルに保存しておくと安心です。読み込むと今の記録は置き換わります。</p><button class="text-link" data-action="export">記録をファイルに保存</button> <button class="text-link" data-action="import-pick">ファイルから読み込む</button><input id="import-file" type="file" accept="application/json,.json" hidden></div><br><button class="danger" data-action="reset-confirm">学習記録をすべて消す</button>`);}
function exportBackup(){try{const url=URL.createObjectURL(new Blob([JSON.stringify(makeBackup(db),null,1)],{type:'application/json'})),a=document.createElement('a');a.href=url;a.download='pokemon-learning-backup-'+dateKey()+'.json';document.body.appendChild(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(url),1000);toast('きろくを ファイルに ほぞんしたよ。');}catch{toast('ファイルを 保存できませんでした。');}}
async function importBackup(file){try{const next=parseBackup(await file.text()),n=new Set(next.catches.map(c=>c.pokemon)).size;if(!confirm('バックアップを読み込みますか？\n（ポケモン '+n+'種類・学習記録 '+Object.keys(next.history).length+'日分）\n今の記録と途中のドリルは置き換わります。'))return;db={settings:{...defaults,...next.settings},history:next.history,session:null,catches:next.catches,rewardProgress:next.rewardProgress};if(![8,12,16].includes(db.settings.count))db.settings.count=12;upgradeLearningState(db);save();modal.innerHTML='';navigate('home');toast('記録を読み込みました。');}catch{toast('このファイルは 読み込めませんでした。');}}
document.addEventListener('change',e=>{if(e.target.id==='import-file'&&e.target.files[0]){importBackup(e.target.files[0]);e.target.value='';}});
function readQuestion(){if(!('speechSynthesis'in window)){toast('このブラウザでは よみあげが つかえないよ。');return;}const q=db.session?.questions[db.session.index];if(!q)return;window.speechSynthesis.cancel();const u=new SpeechSynthesisUtterance(q.text.replace(/×/g,' かける ').replace(/＋/g,' たす ').replace(/−/g,' ひく ').replace(/＝/g,' は ').replace(/[□＿]/g,' なにか ').replace(/？/g,' いくつ '));u.lang='ja-JP';u.rate=.8;u.onerror=()=>toast('よみあげが できなかったよ。もう いちど おしてみてね。');window.speechSynthesis.speak(u);}
function chime(){try{const C=window.AudioContext||window.webkitAudioContext,c=new C();[523,659,784].forEach((f,i)=>{const o=c.createOscillator(),g=c.createGain();o.connect(g);g.connect(c.destination);o.frequency.value=f;g.gain.setValueAtTime(.06,c.currentTime+i*.1);g.gain.exponentialRampToValueAtTime(.001,c.currentTime+i*.1+.2);o.start(c.currentTime+i*.1);o.stop(c.currentTime+i*.1+.21);});setTimeout(()=>c.close(),700);}catch{}}
document.addEventListener('click',e=>{const b=e.target.closest('[data-action]');if(!b||b.disabled)return;const a=b.dataset.action;if(busy&&a!=='catch')return;switch(a){case'nav':navigate(b.dataset.route);break;case'daily':modal.innerHTML='';startDaily();break;case'daily-new':modal.innerHTML='';newDaily();break;case'practice':if(['capture','caught'].includes(db.session?.stage)){navigate('exercise');}else if(db.session&&db.session.index>0&&['questions','break'].includes(db.session.stage)){showDialog('あたらしい クエストに いく？','とちゅうの ドリルは おわりになるよ。ゲットした ポケモンと、つぎの ゲットまでの もんだいすうは のこるよ。',`practice-new-${b.dataset.kind}`,'はじめる');}else startPractice(b.dataset.kind);break;case'resume':navigate('exercise');lastTick=Date.now();break;case'answer':answer(Number(b.dataset.index));break;case'next':next();break;case'hint':feedback={hint:true};render();break;case'continue':db.session.stage='questions';save();feedback=null;render();lastTick=Date.now();break;case'pause':save();navigate(db.session?.mode==='practice'?'practice':'home');break;case'catch':catchPokemon();break;case'capture-continue':continueAfterCapture();break;case'finish':db.session=null;save();navigate('collection');break;case'practice-finish':case'next-quest':db.session=null;save();navigate('practice');break;case'quest-again':{const kind=db.session?.kind||'math';startPractice(kind);break;}case'daily-again':db.session=null;newDaily();break;case'settings':settings();break;case'close':detailRequest++;modal.innerHTML='';break;case'save-settings':db.settings={count:Number(document.getElementById('count').value),range:Number(document.getElementById('range').value),multiply:document.getElementById('multiply').checked,clock:document.getElementById('clock').value,sound:document.getElementById('sound').checked};save();modal.innerHTML='';render();toast(storageOK?'設定を保存しました。次のドリルから反映します。':'設定を保存できません。通常のSafariで開いてください。');break;case'read':readQuestion();break;case'export':exportBackup();break;case'import-pick':document.getElementById('import-file')?.click();break;case'detail':openPokemonDetail(Number(b.dataset.id));break;case'catalog-prev':collectionState.page--;updateCollection();document.getElementById('pokemon-search')?.scrollIntoView({block:'start'});break;case'catalog-next':collectionState.page++;updateCollection();document.getElementById('pokemon-search')?.scrollIntoView({block:'start'});break;case'reset-confirm':showDialog('学習記録をすべて消しますか？','集めたポケモン、学習記録、途中のドリルが消えます。この操作は取り消せません。','reset','すべて消す');break;case'reset':db.history={};db.catches=[];db.rewardProgress=0;db.session=null;save();modal.innerHTML='';navigate('home');toast('学習記録を消しました。');break;default:if(a.startsWith('practice-new-')){modal.innerHTML='';startPractice(a.slice(13));}}});
document.addEventListener('keydown',e=>{if(e.key==='Escape'){detailRequest++;modal.innerHTML='';return;}if(e.key==='Tab'&&modal.firstChild){const nodes=[...modal.querySelectorAll('button,select,input,[tabindex="0"]')];if(!nodes.length)return;if(e.shiftKey&&document.activeElement===nodes[0]){e.preventDefault();nodes.at(-1).focus();}else if(!e.shiftKey&&document.activeElement===nodes.at(-1)){e.preventDefault();nodes[0].focus();}}});
document.addEventListener('visibilitychange',()=>{lastTick=Date.now();save();});
window.addEventListener('pagehide',save);
setInterval(()=>{const now=Date.now(),delta=Math.min(3,Math.floor((now-lastTick)/1000));lastTick=now;const s=db.session;if(document.hidden||route!=='exercise'||modal.firstChild||!s||s.stage!=='questions')return;s.seconds+=delta;const timer=document.getElementById('elapsed');if(timer)timer.textContent=`${Math.floor(s.seconds/60)}ふん ${s.seconds%60}びょう`;if(s.seconds%5===0)save();},1000);
save();render();

document.addEventListener('input',e=>{if(e.target.id==='pokemon-search'){collectionState.query=e.target.value;collectionState.page=1;updateCollection();}});
document.addEventListener('change',e=>{if(e.target.id==='catalog-filter'){collectionState.filter=e.target.value;collectionState.page=1;updateCollection();}if(e.target.id==='catalog-form'){collectionState.form=e.target.value;collectionState.page=1;updateCollection();}if(e.target.id==='catalog-generation'){collectionState.generation=e.target.value;collectionState.page=1;updateCollection();}});
document.addEventListener('error',e=>{const img=e.target;if(!(img instanceof HTMLImageElement)||!img.dataset.pokemonImage)return;if(!img.dataset.fallback){img.dataset.fallback='sprite';img.src=spriteUrl(img.dataset.pokemonImage);}else if(img.dataset.fallback==='sprite'){img.dataset.fallback='missing';img.alt+='（がぞうを よみこめません）';img.classList.add('image-unavailable');img.src='icon.svg';}},true);
const startingCatalogSize=pokemons.length;
refreshCatalog().then(ok=>{if(ok&&pokemons.length!==startingCatalogSize&&['home','collection','history'].includes(route)&&!busy)render();});

})();</script></body>
